<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monochrome Bounce</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Silkscreen:wght@400;700&display=swap">
<style>
  /* ponytail: single visual world (1-bit LCD on a saffron ground), no theme switch */
  :root{
    --feed:#fff8f0; --feed-ink:#161616;
    --card:#f4f4f1; --ink:#161616; --ink-2:#6e6e6a; --rule:#d3d3ce; --press:#e3e3de;
    --lcd:#e3e7e5; --px:#15191b;
    --pix:"Pixelify Sans","Silkscreen",monospace; --lab:"Silkscreen","Courier New",monospace;
  }
  html,body{margin:0;background:var(--feed);color:var(--feed-ink);font-family:var(--lab)}
  .post{max-width:560px;min-height:100vh;box-sizing:border-box;margin:0 auto;padding:24px 16px;display:grid;align-content:center}
  .phone{background:var(--card);color:var(--ink);border-radius:22px;padding:14px 14px 16px;box-shadow:0 1px 0 rgba(22,22,22,.12),0 18px 40px -18px rgba(150,70,0,.22);user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .top{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--lab);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  .logo{font-size:13px;font-weight:700;letter-spacing:.24em}
  [data-icon]{display:inline-flex;line-height:0}
  [data-icon] svg{display:block}
  .logo i{margin-left:6px;vertical-align:-1px}
  .tag{display:inline-flex;gap:6px;align-items:center}
  .dim{color:var(--ink-2)}
  .right{display:flex;gap:12px;align-items:center}
  .snd{color:var(--ink);background:none;border:1px solid var(--rule);border-radius:6px;padding:4px 6px;cursor:pointer;line-height:0}
  .snd:hover{border-color:var(--ink)}
  .lcd{position:relative;margin:10px 0 14px;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--lcd)}
  canvas{display:block;width:100%;aspect-ratio:192/120;image-rendering:pixelated;image-rendering:crisp-edges}
  .lcd::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
    background:linear-gradient(90deg,rgba(21,25,27,.07) 1px,transparent 1px) 0 0/calc(100%/192) 100%,
               linear-gradient(rgba(21,25,27,.07) 1px,transparent 1px) 0 0/100% calc(100%/120)}
  .toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:var(--px);color:var(--lcd);font-family:var(--pix);font-weight:700;font-size:18px;padding:4px 12px;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap}
  .toast.on{opacity:1}
  .menu{position:absolute;inset:0;background:var(--lcd);color:var(--px);font-family:var(--pix);display:grid;grid-template-rows:1fr auto auto auto 1fr auto;justify-items:center;gap:6px;padding:10px 14px 8px}
  .menu[hidden]{display:none}
  .menu h1{grid-row:2;margin:0;font-size:clamp(28px,8vw,40px);font-weight:700;letter-spacing:.01em}
  .pick{grid-row:3;display:flex;align-items:center;gap:22px}
  .pick button,.soft button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:4px 6px}
  .pick button{line-height:0;padding:8px}
  .icon{color:var(--px)}
  .lvl{grid-row:4;font-size:14px}
  .soft{grid-row:6;width:100%;display:flex;justify-content:space-between;font-size:clamp(18px,5vw,24px);font-weight:700}
  .soft button{display:inline-flex;align-items:center;gap:8px}
  .soft button:disabled{opacity:.3;cursor:default}
  .ctrls{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
  .pad{position:relative;width:150px;height:150px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;touch-action:none;cursor:grab}
  .pad.drag{cursor:grabbing}
  .pad span{position:absolute;width:44px;height:44px;display:grid;place-items:center;font-family:var(--lab);font-size:18px;color:var(--ink);pointer-events:none}
  .pad .l{left:4px;top:52px}.pad .r{right:4px;top:52px}.pad .u{top:4px;left:52px}
  .knob{width:66px;height:66px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card) repeating-linear-gradient(135deg,transparent 0 3px,var(--rule) 3px 4px);transition:transform .14s ease-out;pointer-events:none}
  .pad.drag .knob{transition:none;background-color:var(--press)}
  @media (prefers-reduced-motion:reduce){.knob{transition:none}}
  .btns{display:flex;gap:10px;justify-content:flex-end;align-items:stretch;height:132px}
  .btns button{width:92px;border-radius:14px;border:1.5px solid var(--ink);background:none;font-family:var(--lab);font-size:11px;letter-spacing:.08em;color:var(--ink);cursor:pointer;display:grid;place-content:center;justify-items:center;gap:5px}
  .btns .back{align-self:flex-end;height:76px}
  .btns .jump{font-size:13px;font-weight:700}
  .btns small{font-size:7px;color:var(--ink-2)}
  .btns button:active{background:var(--press)}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  @media (max-width:420px){.ctrls{grid-template-columns:120px 1fr}.pad{width:120px;height:120px}.pad .l,.pad .r{top:38px}.pad .u{left:38px}.knob{width:52px;height:52px}.btns{height:110px}.btns button{width:74px}.btns .back{height:64px}}
</style>

<div class="post">
  <div class="phone">
    <div class="top"><div class="logo">BOUNCE<i data-icon="ball" data-s="2"></i></div><div class="right"><button class="snd" id="snd" aria-pressed="true" aria-label="Sound on" title="Sound on"></button><span class="dim tag"><i data-icon="flag" data-s="2"></i><span id="lvlName">LEVEL 1</span></span></div></div>
    <div class="lcd">
      <canvas id="c" width="192" height="120" aria-label="Bounce game screen"></canvas>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="menu" id="menu">
        <h1>Bounce</h1>
        <div class="pick"><button id="prev" aria-label="Previous level"><i data-icon="triL" data-s="3"></i></button><span class="icon" data-icon="ball" data-s="5"></span><button id="next" aria-label="Next level"><i data-icon="triR" data-s="3"></i></button></div>
        <div class="lvl" id="pickName">Level 1</div>
        <div class="soft"><button id="select"><i data-icon="triR" data-s="2"></i>Select</button><button id="resume" disabled><i data-icon="triL" data-s="2"></i>Back</button></div>
      </div>
    </div>
    <div class="ctrls">
      <div class="pad" id="pad" role="application" aria-label="Joystick: drag sideways to roll, push up to jump">
        <span class="u" aria-hidden="true"><i data-icon="up" data-s="3"></i></span>
        <span class="l" aria-hidden="true"><i data-icon="left" data-s="3"></i></span>
        <div class="knob" id="knob"></div>
        <span class="r" aria-hidden="true"><i data-icon="right" data-s="3"></i></span>
      </div>
      <div class="btns">
        <button class="back" id="menuBtn"><i data-icon="menu" data-s="3"></i>BACK<small>MENU · ESC</small></button>
        <button class="jump" data-k="up"><i data-icon="jump" data-s="3"></i>JUMP<small>TAP · SPACE</small></button>
      </div>
    </div>
  </div>
</div>

<script>
// # brick  R rubber  ◢◣◥◤ slopes  ^ thorns  v ceiling thorns  ~ water
// o hoop (stands on its tile, 2 tall)  O hoop in water  i small hoop (small ball only)  = flat hoop (2 wide, jump up through)
// P inflater  p deflater  G gravity  J jump  Z speed  L extra life  C checkpoint  V/H spider  F exit  S start
const LEVELS=[{name:"Level 1",map:[

'#...............###~~~~~~~~~~~~#..###########.............o.....o..................................#',

'#...............###~~~~~~~~~~~~#..p##########.............................H.............◢###◣......#',
'#.S.............###~~~~~~~~~~~~#..............C...G...................C..#..........#..◢#####◣...F.#',

// Physics ported from the original Nokia Bounce (community decompilation, rndtrash/nokia-bounce-decomp):
// 25 ticks/s, integer pixels, velocities in 1/10 px per tick, ball moves one pixel at a time.
const TICK=40, T=12, VW=16, VH=9, W=192, H=120, INK='#15191b', LCD='#e3e7e5', BOOST=300;
const MASK={12:['000011110000','001111111100','011111111110','011111111110','111111111111','111111111111',
                '111111111111','111111111111','011111111110','011111111110','001111111100','000011110000'],
            16:['0000011111100000','0001111111111000','0011111111111100','0111111111111110','0111111111111110',
                '1111111111111111','1111111111111111','1111111111111111','1111111111111111','1111111111111111',
                '1111111111111111','0111111111111110','0111111111111110','0011111111111100','0001111111111000','0000011111100000']};
const SLOPE={'◤':[30,(x,y)=>x+y<=11],'◥':[31,(x,y)=>x>=y],'◢':[32,(x,y)=>x+y>=11],'◣':[33,(x,y)=>x<=y]};
const SOLID=c=>c==='#'||c==='R'||c in SLOPE;
const cv=document.getElementById('c'), g=cv.getContext('2d'), $=id=>document.getElementById(id);

function sprite(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle=INK;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(fn(i,j))x.fillRect(i,j,1,1);return c}
const brick=(x,y)=>!(y===5||y===11||(y<5&&(x===5||x===11))||(y>5&&y<11&&(x===2||x===8)));
const box=(x,y)=>x===1||x===10||y===1||y===10;
const thorn=(x,y)=>y>=2&&Math.abs(x%6-2.5)<=(y-1)/10*3.2;
const S={
  brick:sprite(12,12,brick),
  rubber:sprite(12,12,(x,y)=>!(x%4===1&&y%4===1)&&!((x===0||x===11)&&(y===0||y===11))),
  slope:Object.fromEntries(Object.entries(SLOPE).map(([k,[,f]])=>[k,sprite(12,12,(x,y)=>f(x,y)&&(brick(x,y)||!f(x+(k==='◢'||k==='◥'?-1:1),y)||!f(x,y+(k==='◤'||k==='◥'?1:-1))))])),
  thorn:sprite(12,12,thorn),
  thornDown:sprite(12,12,(x,y)=>thorn(x,11-y)),
  water:[0,2].map(o=>sprite(12,12,(x,y)=>y===0?(x+o)%4<2:y===1?(x+o)%4>=2:y>2&&y%3===0&&(x+y+o)%4===0)),
  deep:sprite(12,12,(x,y)=>y%3===0&&(x+y)%4===0),
  ball:{12:sprite(12,12,(x,y)=>MASK[12][y][x]==='1'&&!((x===3||x===4)&&(y===3||y===4))&&!(x===5&&y===3)),
        16:sprite(16,16,(x,y)=>MASK[16][y][x]==='1'&&!((x>=4&&x<=5)&&(y>=4&&y<=5))&&!(x===6&&y===4)&&!(x===4&&y===6))},
  pop:sprite(12,12,(x,y)=>{const dx=x-5.5,dy=y-5.5;return (Math.abs(dx)<1||Math.abs(dy)<1||Math.abs(Math.abs(dx)-Math.abs(dy))<1)&&dx*dx+dy*dy>4}),
  mini:sprite(7,7,(x,y)=>(x-3)**2+(y-3)**2<=10&&!(x===2&&y===2)),
  miniRing:sprite(3,7,(x,y)=>{const d=((x-1)/1.5)**2+((y-3)/3.5)**2;return d<=1&&d>=.3}),
  cp:[0,1].map(on=>sprite(12,12,(x,y)=>{const d=Math.abs(x-5.5)+Math.abs(y-4.5);return on?d<=4:(d<=4&&d>=3)||(x>=5&&x<=6&&y>=9)})),
  door:[0,1].map(open=>sprite(12,24,(x,y)=>{if(y<2||x<1||x>10)return false;const edge=x<=2||x>=9||y<=3;return edge||(!open&&(x+y)%2===0)||(open&&y>8&&y<18&&x===6)})),
  pump:sprite(12,12,(x,y)=>(x>=4&&x<=7&&y>=4)||(y===2&&x>=2&&x<=9)||(y===3&&(x===5||x===6))),
  deflate:sprite(12,12,(x,y)=>box(x,y)||(x>=5&&x<=6&&y>=3&&y<=6)||(y===7&&x>=3&&x<=8)||(y===8&&x>=4&&x<=7)),
  life:sprite(12,12,(x,y)=>{const d=(x-5.5)**2+(y-5.5)**2;return (d<=9&&!(x===4&&y===4))||(d>=20&&d<=30&&(x+y)%2===0)}),
  grav:sprite(12,12,(x,y)=>box(x,y)||(x>=5&&x<=6&&y>=3&&y<=8)||(y===4&&x>=4&&x<=7)||(y===7&&x>=4&&x<=7)||(y===3&&x>=5&&x<=6)||(y===8&&x>=5&&x<=6)),
  jump:sprite(12,12,(x,y)=>box(x,y)||(y===8&&x>=3&&x<=8)||(y===6&&x>=3&&x<=8)||(y===4&&x>=3&&x<=8)||(x===3&&(y===5||y===7))||(x===8&&(y===5||y===7))&&y<9),
  speed:sprite(12,12,(x,y)=>box(x,y)||[[3,3],[4,4],[5,5],[4,6],[3,7],[6,3],[7,4],[8,5],[7,6],[6,7]].some(([a,c])=>a===x&&c===y)),
  spider:sprite(24,24,(x,y)=>{const dx=x-11.5,dy=y-11.5,r=Math.hypot(dx,dy);if(r<=5.5)return !(Math.abs(dx+2)<1&&Math.abs(dy+2)<1);
    const k=((Math.atan2(dy,dx)/(Math.PI/4))%1+1)%1;return r<=11.5&&Math.min(k,1-k)<(11.5-r)/11.5*.45}),
};
function hoopSprite(flat,small,dotted,front){const w=flat?24:8,h=flat?8:24,a=(small?w-2:w)/2-.5,bb=(small&&!flat?h-4:h)/2-.5,cx=w/2-.5,cy=h/2-.5;
  return sprite(w,h,(x,y)=>{const d=((x-cx)/(a+.5))**2+((y-cy)/(bb+.5))**2;return d<=1&&d>=(small?.3:.42)&&(flat?(front?y>=4:y<4):(front?x>=4:x<4))&&(!dotted||(x+y)%2===0)})}
const HS={};for(const f of [0,1])for(const s of [0,1])for(const d of [0,1])for(const fr of [0,1])HS[[f,s,d,fr]]=hoopSprite(f,s,d,fr);
const DIG=['111101101101111','010110010010111','111001111100111','111001111001111','101101111001001','111100111001111','111100111101111','111001001001001','111101111101111','111101111001111'];
function num(n,len,x,y){String(n).padStart(len,'0').split('').forEach((d,i)=>{const b=DIG[d];for(let k=0;k<15;k++)if(b[k]==='1')g.fillRect(x+i*4+k%3,y+(k/3|0),1,1)})}

// UI icons: 1-bit pixel art, drawn as crisp SVG in the current text colour
const ICONS={
  ball:['..####..','.######.','##..####','##..####','########','########','.######.','..####..'],
  up:['...#...','..###..','.#####.','#######','..###..','..###..','..###..'],
  triR:['#...','##..','###.','####','###.','##..','#...'],
  jump:['....#....','...###...','..#####..','.........','...###...','..#####..','..#####..','...###...'],
  menu:['########','########','........','########','########','........','########','########'],
  flag:['##.....','#####..','#######','#####..','##.....','#......','#......','#......'],
  sndOn:['....#......','...##...#..','#####.#..#.','#####..#.#.','#####..#.#.','#####.#..#.','...##...#..','....#......'],
  sndOff:['....#......','...##......','#####.#...#','#####..#.#.','#####...#..','#####..#.#.','...##.#...#','....#......'],
};
ICONS.triL=ICONS.triR.map(r=>[...r].reverse().join(''));
ICONS.left=ICONS.up[0].split('').map((_,x)=>ICONS.up.map(r=>r[x]).join(''));        // rotate up -> left
ICONS.right=ICONS.left.map(r=>[...r].reverse().join(''));
function pxIcon(name,s){const R=ICONS[name],h=R.length,w=R[0].length;let d='';
  R.forEach((r,y)=>{for(let x=0;x<w;x++)if(r[x]==='#')d+=`M${x} ${y}h1v1h-1z`});
  return `<svg viewBox="0 0 ${w} ${h}" width="${w*s}" height="${h*s}" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true"><path d="${d}"/></svg>`}
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=pxIcon(el.dataset.icon,+el.dataset.s||2));

// sound: short square-wave beeps like the phone speaker
let ac=null,muted=false;try{muted=localStorage.getItem('bounce-muted')==='1'}catch(e){}
function audio(){if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(ac&&ac.state==='suspended')ac.resume()}
function beep(freqs,dur=.07,type='square',to){if(muted||!ac)return;let t=ac.currentTime;for(const f of freqs){const o=ac.createOscillator(),v=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);v.gain.setValueAtTime(.05,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(v).connect(ac.destination);o.start(t);o.stop(t+dur);t+=dur}}
const SFX={hoop:()=>beep([988,1319]),cp:()=>beep([659,988],.05),life:()=>beep([784,988,1175,1568],.05),pop:()=>beep([520],.28,'sawtooth',50),
  big:()=>beep([180],.22,'square',720),small:()=>beep([720],.22,'square',180),clear:()=>beep([523,659,784,1047],.1),over:()=>beep([392,330,262],.2),
  open:()=>beep([1047,1319,1568],.06),power:()=>beep([440,880,660,1320],.05),end:()=>beep([660,440],.06)};
function showSnd(){const el=$('snd'),l=muted?'Sound off':'Sound on';el.innerHTML=pxIcon(muted?'sndOff':'sndOn',2);el.setAttribute('aria-pressed',String(!muted));el.setAttribute('aria-label',l);el.title=l}

let mode='menu',pick=0,lvl=0,grid,rows,cols,hoops,spiders,cp,b,lives=3,score=0,camX=0,camY=0,keys={},jumpBuf=0,clear=0,frame=0,playing=false,events=[];

function load(n){
  lvl=n;grid=LEVELS[n].map.map(r=>[...r]);rows=grid.length;cols=grid[0].length;hoops=[];spiders=[];
  grid.forEach((row,y)=>row.forEach((c,x)=>{
    if('oOi'.includes(c)){hoops.push({k:'v',small:c==='i',c:x,r:y,got:false});row[x]=c==='O'?'~':'.'}
    else if(c==='='){hoops.push({k:'h',small:false,c:x,r:y,got:false});row[x]='.'}
    else if(c==='V'||c==='H'){spiders.push({x:x*T,y:y*T,dx:c==='H'?2:0,dy:c==='V'?2:0});row[x]='.'}
    else if(c==='S'){cp={c:x,r:y,s:12};row[x]='.'}}));
  $('lvlName').textContent=LEVELS[n].name.toUpperCase();respawn();follow(true);
}
function respawn(){const s=cp.s;b={x:cp.c*T+6,y:(cp.r+1)*T-s/2,l:0,o:0,t:0,m:false,u:false,v:false,C:0,pop:0,s,p:s/2,grav:0,jumpP:0,speedP:0}}
const at=(c,r)=>(grid[r]&&grid[r][c])||'#';
const left=()=>hoops.filter(h=>!h.got).length;
const overlap=(ax0,ay0,ax1,ay1,bx0,by0,bx1,by1)=>ax0<=bx1&&ay0<=by1&&bx0<=ax1&&by0<=ay1;
function maskHits(x,y,tx,ty,shape){const s=b.s,M=MASK[s],ox=x-b.p-tx*T,oy=y-b.p-ty*T;
  for(let j=Math.max(0,oy);j<Math.min(12,oy+s);j++)for(let i=Math.max(0,ox);i<Math.min(12,ox+s);i++)if(M[j-oy][i-ox]==='1'&&(!shape||shape(i,j)))return true;return false}
function slopeBounce(id){const i=b.l; // original f.b(int): a slope turns vertical speed into horizontal and back
  if(id===31){b.l=b.l>-b.o?b.l:b.o>>1;b.o=i}else if(id===33){b.l=-b.l>b.o?b.l:b.o>>1;b.o=i}
  else if(id===30){b.l=b.l<b.o?b.l:-(b.o>>1);b.o=-i}else if(id===32){b.l=b.l>b.o?b.l:-(b.o>>1);b.o=-i}}
function rims(h){return h.k==='v'?[[h.c*T+6,(h.r-1)*T],[h.c*T+6,h.r*T+11]]:[[h.c*T,h.r*T+6],[h.c*T+23,h.r*T+6]]}
function zone(h){return h.k==='v'?[h.c*T+4,(h.r-1)*T,h.c*T+7,h.r*T+11]:[h.c*T,h.r*T+4,h.c*T+23,h.r*T+7]}
function power(key){if(!b[key])events.push(['power']);b[key]=BOOST}
function free(x,y){ // original TODO_CheckBallCollision: can the ball stand at (x,y)?
  const p=b.p,x0=x-p,y0=y-p,x1=x+p-1,y1=y+p-1;
  for(let tx=Math.floor(x0/T);tx<=Math.floor(x1/T);tx++)for(let ty=Math.floor(y0/T);ty<=Math.floor(y1/T);ty++){
    const c=at(tx,ty),X=tx*T,Y=ty*T;
    if(c==='#'||(c==='F'&&left())){b.u=true;if(maskHits(x,y,tx,ty))return false}
    else if(c==='R'){b.u=true;if(maskHits(x,y,tx,ty)){b.v=true;return false}}
    else if(c in SLOPE){if(maskHits(x,y,tx,ty,SLOPE[c][1])){if(!b.m)slopeBounce(SLOPE[c][0]);b.u=true;return false}}
    else if(c==='^'||c==='v'){if(overlap(x0,y0,x1,y1,X+4,Y,X+7,Y+11)){events.push(['die']);return false}}
    else if(c==='P'){if(overlap(x0,y0,x1,y1,X+4,Y,X+7,Y+11)){events.push(['big']);return false}}
    else if(c==='p'){events.push(['small']);return false}
    else if(c==='G'){power('grav');b.m=false;return false}
    else if(c==='J'){power('jumpP');return false}
    else if(c==='Z'){power('speedP');return false}
    else if(c==='L')events.push(['life',tx,ty]);
    else if(c==='C')events.push(['cp',tx,ty]);
    else if(c==='F')events.push(['exit']);
  }
  for(const h of hoops){if(rims(h).some(([rx,ry])=>rx>=x0&&rx<=x1&&ry>=y0&&ry<=y1))return false; // the hoop's rim is solid
    if(overlap(x0,y0,x1,y1,...zone(h))){if(h.small&&b.s===16)return false;if(!h.got)events.push(['hoop',h])}}
  for(const sp of spiders)if(overlap(x0+1,y0+1,x1-1,y1-1,sp.x+1,sp.y+1,sp.x+22,sp.y+22)){events.push(['die']);return false}
  return true}
function setSize(s){ // original UseBigBall: grow, then nudge out of any wall it now overlaps
  if(b.s===s)return;const ev=events;events=[];b.s=s;b.p=s/2;
  if(!free(b.x,b.y))outer:for(let o=1;o<=16;o++)for(const [dx,dy] of [[0,-o],[-o,-o],[o,-o],[0,o],[-o,o],[o,o]])if(free(b.x+dx,b.y+dy)){b.x+=dx;b.y+=dy;break outer}
  events=ev;s===16?SFX.big():SFX.small()}
function moveSpiders(){for(const sp of spiders){
  const hit=(x,y)=>{for(let tx=Math.floor(x/T);tx<=Math.floor((x+23)/T);tx++)for(let ty=Math.floor(y/T);ty<=Math.floor((y+23)/T);ty++)if(SOLID(at(tx,ty)))return true;return false};
  if(hit(sp.x+sp.dx,sp.y+sp.dy)){sp.dx=-sp.dx;sp.dy=-sp.dy}else{sp.x+=sp.dx;sp.y+=sp.dy}}}
function die(){if(b.pop)return;b.pop=7;lives--;b.grav=b.jumpP=b.speedP=0;SFX.pop();toast(lives<0?'Game over':'Pop!')}
function step(){ // port of the original f.b(): one 40 ms tick
  if(clear>0){if(--clear===0){if(lvl+1<LEVELS.length)load(lvl+1);else{toast('You win!',1800);playing=false;setTimeout(openMenu,1600)}}return}
  moveSpiders();
  if(b.pop>0){if(--b.pop===0){if(lives<0){SFX.over();playing=false;setTimeout(openMenu,1200)}else respawn()}return}
  events=[];
  const wet=at(b.x/T|0,b.y/T|0)==='~',big=b.s===16,held=keys.up||jumpBuf>0;
  let k,j;                                     // terminal speed and gravity per tick
  if(wet){if(big){k=-30;j=-2;if(b.m)b.o=-10}else{k=42;j=6}} // big ball floats, small ball sinks
  else if(big){k=38;j=3}else{k=80;j=4}
  let inv=false;                               // gravity power-up flips everything
  if(b.grav){inv=true;k=-k;j=-j;if(--b.grav===0){inv=false;b.m=false;k=-k;j=-j;SFX.end()}}
  if(b.jumpP){if(-Math.abs(b.t)>-80)b.t=inv?80:-80;if(--b.jumpP===0)SFX.end()}
  b.C=(b.C+1)%3;
  b.o=Math.max(-150,Math.min(150,b.o));b.l=Math.max(-150,Math.min(150,b.l));
  if(b.o<10&&b.o>0&&!wet&&!inv)b.o=10;
  for(let n=Math.abs(b.o)/10|0,i=0;i<n;i++){const s=Math.sign(b.o);
    if(free(b.x,b.y+s)){b.y+=s;b.m=false;
      if(k===-30&&at(b.x/T|0,b.y/T|0)!=='~'){b.o>>=1;if(b.o<=10&&b.o>=-10)b.o=0} // bob at the surface
      continue}
    if(b.u&&b.l<10&&b.C===0){if(free(b.x+1,b.y+s)){b.x++;b.y+=s;b.u=false}else if(free(b.x-1,b.y+s)){b.x--;b.y+=s;b.u=false}}
    if(s>0||(inv&&s<0)){b.o=Math.trunc(-b.o/2);b.m=true;           // land: bounce back at half speed
      if(b.v&&held){b.v=false;b.t+=inv?10:-10}else if(!b.jumpP)b.t=0; // rubber: each held bounce goes higher
      if(b.o<10&&b.o>-10){if(inv){b.o=-10;break}b.o=10}
      break}
    b.o=inv?-20:-b.o>>1;
  }
  if(inv){if(j===-2&&b.o<k){b.o+=j;if(b.o>k)b.o=k}else if(!b.m&&b.o>k){b.o+=j;if(b.o<k)b.o=k}}
  else if(j===-2&&b.o>k){b.o+=j;if(b.o<k)b.o=k}else if(!b.m&&b.o<k){b.o+=j;if(b.o>k)b.o=k}
  const max=b.speedP?100:50;if(b.speedP&&--b.speedP===0)SFX.end();
  if(keys.right&&b.l<max)b.l+=6;else if(keys.left&&b.l>-max)b.l-=6;else if(b.l>0)b.l-=4;else if(b.l<0)b.l+=4;
  if(big&&!b.jumpP)b.t+=inv?5:-5;
  if(b.m&&held){b.o=inv?67+b.t:-67+b.t;b.m=false;jumpBuf=0}      // hold jump to keep bouncing, like the phone
  else if(!inv&&big&&held&&(wet||at(b.x/T|0,(b.y+b.p)/T|0)==='~')&&Math.abs(b.o)<=20){b.o=-72;jumpBuf=0} // ponytail: jump off the water surface; the original is stricter
  if(jumpBuf>0)jumpBuf--;
  for(let n=Math.abs(b.l)/10|0,i=0;i<n;i++){const s=Math.sign(b.l),d=inv?1:-1;
    if(free(b.x+s,b.y))b.x+=s;
    else if(b.u){b.u=false;if(free(b.x+s,b.y+d)){b.x+=s;b.y+=d}else if(free(b.x+s,b.y-d)){b.x+=s;b.y-=d}else b.l=-(b.l>>1)}}
  free(b.x,b.y);
  for(const e of events){const [t,a,c]=e;
    if(t==='die')die();
    else if(t==='big')setSize(16);
    else if(t==='small')setSize(12);
    else if(t==='power')SFX.power();
    else if(t==='hoop'&&!a.got){a.got=true;score+=500;SFX.hoop();if(!left()){toast('Exit open');SFX.open()}}
    else if(t==='life'&&at(a,c)==='L'){grid[c][a]='.';score+=1000;if(lives<5)lives++;SFX.life()}
    else if(t==='cp'&&at(a,c)==='C'){if(grid[cp.r][cp.c]==='K')grid[cp.r][cp.c]='C';grid[c][a]='K';cp={c:a,r:c,s:b.s};score+=200;SFX.cp()}
    else if(t==='exit'&&!left()&&!clear&&!b.pop){score+=5000;toast('Level clear',1400);SFX.clear();clear=35}
  }
  follow();
}
function follow(snap){camX=Math.max(0,Math.min(b.x-W/2,cols*T-W));
  const ty=Math.max(0,Math.min(b.y-54,rows*T-108));camY=snap?ty:camY+Math.round((ty-camY)/3)} // ponytail: tall levels scroll vertically, eased so jumps don't jolt
let tt;function toast(t,ms=1100){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),ms)}

function draw(){
  g.fillStyle=LCD;g.fillRect(0,0,W,H);g.fillStyle=INK;
  if(!grid)return;
  const ox=-camX,oy=-camY,c0=Math.floor(camX/T),r0=Math.floor(camY/T),open=!left();
  for(let r=r0;r<=r0+VH;r++)for(let c=c0;c<=c0+VW;c++){const t=at(c,r),px=c*T+ox,py=r*T+oy;
    if(t==='#')g.drawImage(S.brick,px,py);
    else if(t==='R')g.drawImage(S.rubber,px,py);
    else if(t in SLOPE)g.drawImage(S.slope[t],px,py);
    else if(t==='^')g.drawImage(S.thorn,px,py);
    else if(t==='v')g.drawImage(S.thornDown,px,py);
    else if(t==='~')g.drawImage(at(c,r-1)==='~'?S.deep:S.water[(frame>>4)&1],px,py);
    else if(t==='C'||t==='K')g.drawImage(S.cp[+(t==='K')],px,py);
    else if(t==='P')g.drawImage(S.pump,px,py);
    else if(t==='p')g.drawImage(S.deflate,px,py);
    else if(t==='G')g.drawImage(S.grav,px,py);
    else if(t==='J')g.drawImage(S.jump,px,py);
    else if(t==='Z')g.drawImage(S.speed,px,py);
    else if(t==='L')g.drawImage(S.life,px,py);
    else if(t==='F')g.drawImage(S.door[+open],px,py-T);}
  const hs=hoops.filter(h=>h.c>=c0-2&&h.c<=c0+VW+1),
        hp=(h,f)=>[HS[[+(h.k==='h'),+h.small,+h.got,f]],...(h.k==='v'?[h.c*T+ox+2,(h.r-1)*T+oy]:[h.c*T+ox,h.r*T+2+oy])];
  hs.forEach(h=>g.drawImage(...hp(h,0)));
  g.drawImage(b.pop?S.pop:S.ball[b.s],b.x-b.p+ox,b.y-b.p+oy);
  hs.forEach(h=>g.drawImage(...hp(h,1)));
  spiders.forEach(sp=>g.drawImage(S.spider,sp.x+ox,sp.y+oy));
  // status bar: lives, one hoop icon per hoop left, power-up time left, score
  g.fillStyle=LCD;g.fillRect(0,108,W,12);g.fillStyle=INK;g.fillRect(0,108,W,1);
  for(let i=0;i<Math.max(0,lives);i++)g.drawImage(S.mini,3+i*8,111);
  for(let i=0,n=left();i<n;i++)g.drawImage(S.miniRing,48+i*4,111);
  const boost=Math.max(b.grav,b.jumpP,b.speedP);
  if(boost){const ic=b.grav?S.grav:b.jumpP?S.jump:S.speed;g.drawImage(ic,108,109);g.fillRect(122,113,Math.ceil(boost/BOOST*36),3);g.fillRect(122,116,36,1)}
  num(score,6,W-3-23,112);
}
let acc=0,last=0;function loop(t){acc+=Math.min(200,t-(last||t));last=t; // ponytail: fixed 25Hz tick like the phone, no interpolation (the chunky motion is the point)
  if(mode==='play')while(acc>=TICK){step();frame++;acc-=TICK}else acc=0;draw();requestAnimationFrame(loop)}

// menu
function showPick(){$('pickName').textContent=LEVELS[pick].name}
function openMenu(){mode='menu';keys={};$('menu').hidden=false;$('resume').disabled=!playing;showPick();$('select').focus({preventScroll:true})}
function start(){audio();lives=3;score=0;clear=0;playing=true;load(pick);closeMenu()}
function closeMenu(){audio();mode='play';$('menu').hidden=true}
function cycle(d){pick=(pick+d+LEVELS.length)%LEVELS.length;showPick()}
$('prev').onclick=()=>cycle(-1);$('next').onclick=()=>cycle(1);
$('select').onclick=start;$('resume').onclick=()=>playing&&closeMenu();
$('menuBtn').onclick=()=>mode==='menu'?(playing&&closeMenu()):openMenu();
$('snd').onclick=()=>{muted=!muted;try{localStorage.setItem('bounce-muted',muted?'1':'0')}catch(e){}showSnd();audio();SFX.cp()};showSnd();

// input
const KM={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',' ':'up'};
addEventListener('keydown',e=>{
  if(e.key==='Escape'){mode==='menu'?(playing&&closeMenu()):openMenu();return}
  if(mode==='menu'){if(e.key==='ArrowLeft')cycle(-1);else if(e.key==='ArrowRight')cycle(1);else if(e.key==='Enter'&&e.target.tagName!=='BUTTON'||e.key===' '){e.preventDefault();start()}return}
  const k=KM[e.key];if(k){keys[k]=true;if(k==='up')jumpBuf=3;e.preventDefault()}});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)keys[k]=false});
addEventListener('blur',()=>{keys={};release()});
// joystick: drag the knob like a mobile shooter; sideways rolls, pushing up jumps (held = keep bouncing)
const pad=$('pad'),knob=$('knob');let pid=null;
function stick(e){const r=pad.getBoundingClientRect(),max=(r.width-knob.offsetWidth)/2;
  let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const d=Math.hypot(dx,dy);if(d>max){dx*=max/d;dy*=max/d}
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  keys.left=dx<-max*.3;keys.right=dx>max*.3;const up=dy<-max*.5;if(up&&!keys.up)jumpBuf=3;keys.up=up}
function release(e){if(e&&e.pointerId!==pid)return;pid=null;pad.classList.remove('drag');knob.style.transform='';keys.left=keys.right=keys.up=false}
pad.addEventListener('pointerdown',e=>{e.preventDefault();audio();
  if(mode==='menu'){const r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    if(Math.abs(dx)>Math.abs(dy))cycle(Math.sign(dx));else if(dy<0)start();return}
  pid=e.pointerId;try{pad.setPointerCapture(pid)}catch(_){}pad.classList.add('drag');stick(e)});
pad.addEventListener('pointermove',e=>{if(e.pointerId===pid)stick(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>pad.addEventListener(t,release));
document.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;
  el.addEventListener('pointerdown',e=>{e.preventDefault();audio();if(mode==='menu'){k==='left'?cycle(-1):k==='right'?cycle(1):start();return}keys[k]=true;if(k==='up')jumpBuf=3});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,()=>keys[k]=false))});

load(0);openMenu();requestAnimationFrame(loop);
</script>
